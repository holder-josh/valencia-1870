name: Sync Strava
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *" # every 10 minutes; GitHub may delay scheduled jobs
  workflow_dispatch:

concurrency:
  group: strava-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test dashboard and FIT exports
        run: npm test
      - name: Test exporter
        run: python -m unittest discover -s tests -v
      - name: Pull activities from Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python scripts/sync_strava.py
      - name: Commit if changed
        run: |
          git config user.name "strava-sync"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "sync: detailed Strava exports"
          git push
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish dashboard and exports
        id: deployment
        uses: actions/deploy-pages@v4
