name: Sync Strava
on:
  schedule:
    - cron: "15 * * * *"   # hourly at :15
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull activities from Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python scripts/sync_strava.py
      - name: Commit if changed
        run: |
          git config user.name "strava-sync"
          git config user.email "actions@users.noreply.github.com"
          git add docs/activities.json
          git diff --cached --quiet || git commit -m "sync: activities $(date -u +%F' '%H:%M)"
          git push
